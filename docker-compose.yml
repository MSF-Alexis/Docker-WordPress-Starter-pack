services:
  mariadb-dev:
    image: mariadb:latest
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME manquant dans .env}
      MARIADB_USER: ${DB_USER:?DB_USER manquant dans .env}
      MARIADB_PASSWORD_FILE: /run/secrets/wordpress_db_password

    secrets:
      - mariadb_root_password
      - wordpress_db_password

    volumes:
      - mariadb-volume:/var/lib/mysql

    networks:
      - backend

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin-dev:
    image: phpmyadmin:latest
    restart: unless-stopped

    environment:
      PMA_HOST: mariadb-dev
      PMA_PORT: 3306

    depends_on:
      mariadb-dev:
        condition: service_healthy

    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8989}:80"

    networks:
      - backend

  wordpress-dev:
    image: wordpress:php8.5-apache
    restart: unless-stopped

    environment:
      WORDPRESS_DB_HOST: mariadb-dev:3306
      WORDPRESS_DB_USER: ${DB_USER:?DB_USER manquant dans .env}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/wordpress_db_password
      WORDPRESS_DB_NAME: ${DB_NAME:?DB_NAME manquant dans .env}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}

    secrets:
      - wordpress_db_password

    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"

    volumes:
      - .:/var/www/html
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro

    networks:
      - backend

    depends_on:
      mariadb-dev:
        condition: service_healthy

secrets:
  mariadb_root_password:
    file: ./secrets/mariadb_root_password.txt

  wordpress_db_password:
    file: ./secrets/wordpress_db_password.txt

volumes:
  mariadb-volume:

networks:
  backend: